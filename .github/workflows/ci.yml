# The gate in front of production: Vercel deploys main, and main only takes pull requests with
# this check green (branch ruleset). Read-only token; actions pinned to release commits.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a PR run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # All dependencies: the build toolchain (vite, typescript…) produces what ships.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (builds, then tests the preview with the production headers)
        run: npm run test:e2e

      - name: Keep Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
